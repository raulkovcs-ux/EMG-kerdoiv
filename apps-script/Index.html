<!DOCTYPE html>
<html lang="hu">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font-family: Arial, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #202124; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.lead { color: #5f6368; margin-top: 0; }
  label.field { display: block; margin-top: 16px; font-weight: bold; }
  input[type=text], input[type=number], input[type=tel], input[type=email], select {
    width: 100%; box-sizing: border-box; padding: 9px; margin-top: 6px; font-size: 15px;
    border: 1px solid #dadce0; border-radius: 4px; }
  .opts label { font-weight: normal; margin-right: 16px; }
  .day { margin-top: 12px; }
  .day b { display: block; margin-bottom: 4px; }
  .slot { display: inline-block; margin: 0 8px 8px 0; }
  .slot input { margin-right: 4px; }
  .note { background: #f1f3f4; padding: 10px; border-radius: 4px; margin-top: 16px; font-size: 14px; }
  button { margin-top: 20px; padding: 11px 22px; font-size: 16px; background: #1a73e8; color: #fff;
    border: 0; border-radius: 4px; cursor: pointer; }
  button:disabled { background: #9aa0a6; }
  .err { color: #c5221f; margin-top: 12px; }
  .ok { background: #e6f4ea; padding: 16px; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <h1>sEMG adatbázis – önkéntes jelentkezés</h1>
  <p class="lead">Segíts az sEMG adatbázis elkészítésében. Egy mérés egy órát vesz igénybe.</p>
  <p id="loading">Betöltés…</p>
  <form id="form" hidden>
    <label class="field" for="name">Név</label>
    <input type="text" id="name" required autocomplete="name">

    <label class="field" for="gender">Nem</label>
    <select id="gender" required></select>

    <label class="field" for="age">Kor</label>
    <input type="number" id="age" min="14" max="99" required>

    <span class="field" style="display:block;margin-top:16px;font-weight:bold">Domináns kéz</span>
    <div class="opts" id="hands"></div>

    <label class="field" for="phone">Telefonszám (mindig elérhető, az emlékeztetéshez)</label>
    <input type="tel" id="phone" required autocomplete="tel">

    <label class="field" for="email">E-mail cím</label>
    <input type="email" id="email" required autocomplete="email">

    <span class="field" style="display:block;margin-top:16px;font-weight:bold">Időpont</span>
    <div id="days"></div>
    <div class="note" id="note"></div>

    <label class="field" style="font-weight:normal">
      <input type="checkbox" id="consent">
      Hozzájárulok, hogy a megadott adataimat a kutatás során kezeljék, és a mérési adataimat
      azonosító alapján (név nélkül) tárolják.
    </label>

    <div class="err" id="err" role="alert"></div>
    <button type="submit" id="btn">Jelentkezem</button>
  </form>
  <div id="done" class="ok" hidden></div>
</div>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var dateFmt = new Intl.DateTimeFormat('hu-HU', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  function niceDate(s) { var p = s.split('-'); return dateFmt.format(new Date(+p[0], +p[1] - 1, +p[2])); }

  function render(d) {
    $('loading').hidden = true;
    $('gender').innerHTML = '<option value="">Válassz…</option>' +
      d.genders.map(function (g) { return '<option>' + g + '</option>'; }).join('');
    $('hands').innerHTML = d.hands.map(function (h, i) {
      return '<label><input type="radio" name="hand" value="' + h + '"' + (i === 0 ? ' required' : '') + '> ' + h + '</label>';
    }).join('');
    $('note').textContent = 'Kérjük, legalább ' + d.earlyMin + ' perccel az időpontod előtt érkezz.';
    if (!d.days.length) {
      $('days').innerHTML = '<p class="err">Sajnos minden időpont betelt.</p>';
      $('btn').disabled = true;
    } else {
      $('days').innerHTML = d.days.map(function (day) {
        return '<div class="day"><b>' + niceDate(day.date) + '</b>' + day.slots.map(function (s) {
          return '<label class="slot"><input type="radio" name="slot" required value="' + day.date + '|' + s.hour + '">' + s.label + '</label>';
        }).join('') + '</div>';
      }).join('');
    }
    $('form').hidden = false;
  }

  function load() { google.script.run.withSuccessHandler(render).getAvailableSlots(); }
  load();

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    $('err').textContent = '';
    var slot = document.querySelector('input[name=slot]:checked');
    var hand = document.querySelector('input[name=hand]:checked');
    var parts = slot.value.split('|');
    $('btn').disabled = true;
    google.script.run
      .withSuccessHandler(function (r) {
        $('form').hidden = true;
        $('done').hidden = false;
        $('done').innerHTML = '<b>Köszönjük a jelentkezést!</b><br>Időpontod: ' + niceDate(r.date) + ', ' + r.label +
          '.<br>Kérjük, legalább 10 perccel korábban érkezz. Visszaigazolást küldtünk az e-mail címedre.';
      })
      .withFailureHandler(function (err) {
        $('err').textContent = err.message.replace(/^Error: /, '');
        $('btn').disabled = false;
        load();
      })
      .submitRegistration({
        name: $('name').value, gender: $('gender').value, age: $('age').value,
        hand: hand ? hand.value : '', phone: $('phone').value, email: $('email').value,
        date: parts[0], hour: parts[1], consent: $('consent').checked
      });
  });
</script>
</body>
</html>
